  /* ULYA-CSS-END */
  /* ===== Оля: раскладка и элементы — Уля v2 (uzum-minus-app 6b43ad4), цвета — фиолетовые в духе WB (Николай 11.10) ===== */
  :root, :root.light { --page:radial-gradient(120% 55% at 0% 0%,#efe2fb 0%,transparent 60%),linear-gradient(180deg,#f5f2f8 0%,#ebe6f3 55%,#c9bde0 100%);
    --bg:#f4f1f8; --line:#e6dff0; --hint:#857c92;
    --acc:#8b2fd9; --acc-soft:#efe2fb; --bad:#e5484d; --bad-soft:#fde4e4;
    --hero:radial-gradient(90% 120% at 0% 100%,#cb11ab 0%,transparent 55%),radial-gradient(80% 100% at 100% 0%,#a46bf0 0%,transparent 60%),linear-gradient(135deg,#9a2bd6 0%,#6a2bb8 55%,#481173 100%); --hero-on:#5b1a8f; }
  :root.dark { --page:radial-gradient(110% 55% at 0% 0%,#2a1640 0%,transparent 60%),linear-gradient(180deg,#141218 0%,#17131f 60%,#221a33 100%);
    --bg:#121016; --line:#2c2636; --hint:#918a9c;
    --acc:#b46bff; --acc-soft:#2c1a40; --bad:#ff6b6b; --bad-soft:#3a1c1f;
    --hero:radial-gradient(90% 120% at 0% 100%,#a3168c 0%,transparent 55%),radial-gradient(80% 100% at 100% 0%,#7b4fd0 0%,transparent 60%),linear-gradient(135deg,#5e1f9e 0%,#3a1f63 60%,#1d1530 100%); --hero-on:#5b1a8f; }
  body { padding-bottom:calc(28px + env(safe-area-inset-bottom,0px)); }
  #tabs { display:flex; }
  #tabs div { cursor:pointer; }
  .krow, .chips span, .kback { cursor:pointer; }
  .p-acc { background:var(--acc-soft); color:var(--acc); }
  .ev .tx small { display:block; font-weight:300; color:var(--hint); font-size:11px; }
  .who { font-size:10px; font-weight:500; padding:1px 6px; border-radius:999px; margin-right:4px; vertical-align:1px; }
  .who.x { background:var(--wait-soft); color:var(--wait); } .who.o { background:var(--acc-soft); color:var(--acc); }
  .todo2 .it i.bad { background:var(--bad-soft); color:var(--bad); } .todo2 .it i.acc { background:var(--acc-soft); color:var(--acc); }
  .todo2 .it i.wait { background:var(--wait-soft); color:var(--wait); } .todo2 .it i.idle { background:var(--idle-soft); color:var(--idle); }
  details > summary { list-style:none; cursor:pointer; } details > summary::-webkit-details-marker { display:none; }
  .notes p { margin:0; font-size:12px; font-weight:300; color:var(--hint); line-height:1.4; }
  .sum { background:var(--card); border-radius:22px; padding:12px 14px; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .sum p { margin:0 0 6px; font-weight:300; font-size:13px; line-height:1.45; overflow-wrap:anywhere; }
  .sum p.h { font-weight:500; font-size:14px; margin-top:10px; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="list"><div class="empty">Загружаю…</div></div>

<script>
(function () {
  'use strict';
  var API_HOSTS = ['https://ulya.dacutavio.ru', 'https://ulya2.dacutavio.ru', 'https://ulya3.dacutavio.ru'];
  var tg = window.Telegram && Telegram.WebApp, inTg = !!(tg && tg.initData);
  var list = document.getElementById('list'), tabs = document.getElementById('tabs');
  var S = null, view = {tab: 'stavki', chip: 'all', cluster: null};
  if (tg) { tg.ready(); if (tg.expand) tg.expand(); }
  function theme() {
    var dark = inTg ? tg.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.className = dark ? 'dark' : 'light';
  }
  theme();
  if (tg && tg.onEvent) tg.onEvent('themeChanged', theme);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; })
    .replace(/(\d) (?=\d{3}\b)/g, '$1&nbsp;').replace(/ ₽/g, '&nbsp;₽'); }      // «12 872 ₽» не рвётся по строкам
  function tap() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  function spark(hist, color) {
    var v = (hist || []).filter(function (x) { return x != null; });
    if (!v.length) return '<svg class="sp" viewBox="0 0 50 20" aria-hidden="true"><line x1="0" y1="10" x2="50" y2="10" stroke="var(--idle)" stroke-width="1.2" stroke-dasharray="2 3"/></svg>';
    var lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), n = hist.length, pts = [];
    hist.forEach(function (p, i) {
      if (p == null) return;
      pts.push((n > 1 ? 50 * i / (n - 1) : 25).toFixed(1) + ',' + (2 + (hi > lo ? 16 * (p - lo) / (hi - lo) : 8)).toFixed(1));   // лучше место — выше
    });
    return '<svg class="sp" viewBox="0 0 50 20" aria-hidden="true"><polyline points="' + pts.join(' ') + '" fill="none" stroke="var(' + esc(color) + ')" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function tilesHtml(ts, cls) {
    return '<div class="bento' + (cls ? ' ' + cls : '') + '">' + ts.map(function (t) {
      return '<div class="tile"><span class="l">' + esc(t.l) + '</span><span class="v">' + esc(t.v) + '</span><span class="n">' + esc(t.n) + '</span></div>';
    }).join('') + '</div>';
  }
  function renderTabs() {
    var n = S.tabs && S.tabs.stavki;
    tabs.innerHTML = '<div data-tab="stavki" class="' + (view.tab === 'stavki' ? 'on' : '') + '">Ставки' + (n ? '<em>' + esc(n) + '</em>' : '') + '</div>' +
      '<div data-tab="sum" class="' + (view.tab === 'sum' ? 'on' : '') + '">Сводка</div>';
    tabs.style.display = view.cluster ? 'none' : 'flex';
  }
  function head() { return '<p class="head">Оля · <b>' + esc(S.title) + '</b>' + (S.fresh ? ' · замер ' + esc(S.fresh) : '') + '</p>'; }
  function cabinet() {
    var h = S.hero, rows = S.rows.filter(function (r) { return view.chip === 'all' || r.group === view.chip; });
    return head() +
      '<div class="hero"><span class="t">' + esc(h.t) + '</span><span class="big">' + esc(h.big) + '</span><span class="sub">' + esc(h.sub) + '</span>' +
      '<div class="ticks">' + h.ticks.map(function (t, i) { return '<span' + (i === h.next ? ' class="on"' : '') + '>' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<span class="nx">следующее решение в ' + esc(h.ticks[h.next]) + '</span></div>' +
      tilesHtml(S.tiles) +
      '<div class="chips">' + S.chips.map(function (c) {
        return '<span data-chip="' + esc(c.id) + '"' + (view.chip === c.id ? ' class="on"' : '') + '>' + esc(c.label) + ' ' + esc(c.n) + '</span>';
      }).join('') + '</div>' +
      '<div class="klist">' + (rows.length ? rows.map(function (r) {
        return '<div class="krow" data-id="' + esc(r.id) + '"><span class="k">' + esc(r.k) + '</span>' + spark(r.hist, r.spark) +
          '<span class="kb">' + esc(r.bid) + '</span><span class="d">' + esc(r.d) + '</span><span class="pill ' + esc(r.pill) + '">' + esc(r.label) + '</span></div>';
      }).join('') : '<div class="empty">В этой группе пусто</div>') + '</div>';
  }
  function cluster(id) {
    var c = S.clusters[id];
    if (!c) return '<div class="empty">Кластер не найден — обновите экран</div>';
    return '<div class="kback" data-back="1"><i>‹</i><span>' + esc(c.title) + '</span></div>' +
      '<div class="focus"><span class="fl">' + esc(c.focus.fl) + '</span><span class="fv">' + esc(c.focus.fv) + '<small> ₽</small></span><span class="fs">' + esc(c.focus.fs) + '</span></div>' +
      tilesHtml(c.tiles, 't3') +
      '<div class="tl"><div class="l">Что делали XWay и Оля</div>' + (c.timeline.length ? c.timeline.map(function (e) {
        var who = e.who ? '<span class="who ' + (e.who === 'XWay' ? 'x' : 'o') + '">' + esc(e.who) + '</span>' : '';
        return '<div class="ev"><span class="tm">' + esc(e.tm) + '</span><span class="dot" style="background:var(--' + esc(e.color) + ')"></span><span class="tx">' + who + esc(e.tx) + '<small>' + esc(e.small) + '</small></span></div>';
      }).join('') : '<div class="empty" style="padding:8px 0 12px">За час ставка не менялась</div>') + '</div>' +
      '<div class="advice"><span class="l">Совет · ' + esc(c.label) + '</span><span>' + esc(c.advice) + '</span></div>';
  }
  function num(x) { return (x == null || x === '' || isNaN(x)) ? '—' : Math.round(x).toLocaleString('ru-RU').replace(/,/g, ' '); }
  function n0(s) { var v = parseFloat(String(s).replace(/[\s ]/g, '').replace(',', '.')); return isNaN(v) ? null : v; }
  function msk(iso) { try { return new Date(iso).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow'}); } catch (e) { return ''; } }
  function acts(list) {
    return list.map(function (a, i) { return '<div class="it"><i class="' + esc(a.c) + '">' + (i + 1) + '</i><span>' + esc(a.t) + '<small>' + esc(a.w) + '</small></span></div>'; }).join('');
  }
  function summary() {
    var sm = S.summary;
    if (!sm) return head() + '<div class="empty">Сводка появится после 09:30</div>';
    if (!sm.brands) return head() + '<div class="sum">' + sm.lines.map(function (ln) { return ln.trim() ? '<p>' + esc(ln) + '</p>' : ''; }).join('') + '</div>';
    var bs = sm.brands, bi = Math.min(view.brand || 0, bs.length - 1), b = bs[bi];
    var h = '<p class="head">Сводка на <b>' + esc(msk(sm.at)) + '</b> · утренняя, раз в день</p>';
    if (bs.length > 1) h += '<div class="chips" style="margin-top:0">' + bs.map(function (x, i) {
      return '<span data-brand="' + i + '"' + (i === bi ? ' class="on"' : '') + '>' + esc(x.title) + ' ' + x.acts.length + '</span>'; }).join('') + '</div>';
    var cpo = b.cpo7 ? num(b.cpo7) + (b.cpo_prev ? '<small style="font-size:10px;opacity:.85"> было ' + num(b.cpo_prev) + '</small>' : '') : '—';
    h += '<div class="hero" style="margin-bottom:8px"><span class="t">Расход вчера · ' + esc(b.title) + '</span><span class="big">' + num(b.spend1) + '<small> ₽</small></span>' +
      '<div class="minirow"><span>Заказы вчера<b>' + num(b.orders1) + '</b></span><span>CPO 7 дн.<b>' + cpo + '</b></span><span>Ждут решения<b>' + b.acts.length + '</b></span></div></div>';
    if (b.quiet) return h + '<div class="empty">Реклама почти стоит: ' + num(b.spend7) + ' ₽ за 7 дней</div>';
    h += '<p class="sec">Что сделать · сначала, где больше денег</p>';
    h += b.acts.length ? '<div class="todo2">' + acts(b.acts.slice(0, 5)) +
      (b.acts.length > 5 ? '<details><summary class="more">и ещё ' + (b.acts.length - 5) + ' — показать</summary><div style="display:grid;gap:8px;margin-top:8px">' + acts(b.acts.slice(5)).replace(/<i class="(\w+)">(\d+)</g, function (m, c, n) { return '<i class="' + c + '">' + (+n + 5) + '<'; }) + '</div></details>' : '') + '</div>'
      : '<div class="todo2"><div class="it"><i class="ok">✓</i><span>Ставки поиска в пределах выгодного</span></div></div>';
    if (b.shelves.length) {
      h += '<p class="sec">Полки · расход за 30 дней · CPO полок неточен — проверять тестом отключения</p><div class="hlist">' + b.shelves.map(function (x) {
        var c = n0(x.cpo), be = n0(x.be), over = c != null && be != null && c > be;
        var pc = c == null || be == null ? 0 : over ? Math.round(100 * be / c) : 100, ring = c == null ? 'idle' : over ? 'bad' : 'ok';
        var pill = c == null ? ['Нет заказов', 'idle'] : over ? ['Дороже безубытка', 'bad'] : ['В норме', 'ok'];
        return '<div class="hrow"><span class="ord" style="--p:' + pc + ';--ring:var(--' + ring + ')"><b>' + (n0(x.carts) >= 1000 ? (n0(x.carts) / 1000).toFixed(1).replace('.', ',') + 'к' : esc(x.carts)) + '</b><i>корз</i></span>' +
          '<span class="k">' + esc(x.name) + '</span><span class="v">' + esc(x.spend) + '</span>' +
          '<span class="d">CPO ' + esc(x.cpo) + ' · безубыток ' + esc(x.be) + ' · ' + esc(x.bid) + '</span><span class="pill p-' + pill[1] + '">' + pill[0] + '</span></div>';
      }).join('') + '</div>';
    }
    if (b.dels.length) h += '<p class="sec">Чистка ключей · не больше 2 на товар</p><div class="todo2">' +
      acts(b.dels.map(function (x) { return {c: 'bad', t: x.t, w: x.w}; })) + '</div>';
    if (b.notes.length) h += '<details style="margin-top:8px"><summary class="sec">Примечания · ' + b.notes.length + '</summary><div class="todo2 notes">' +
      b.notes.map(function (n) { return '<p>' + esc(n) + '</p>'; }).join('') + '</div></details>';
    return h;
  }
  function render() {
    renderTabs();
    list.innerHTML = view.cluster ? cluster(view.cluster) : view.tab === 'sum' ? summary() : cabinet();
    if (tg && tg.BackButton) { if (view.cluster) tg.BackButton.show(); else tg.BackButton.hide(); }
  }
  function back() { view.cluster = null; render(); window.scrollTo(0, 0); }
  if (tg && tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(back);
  document.body.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab],[data-chip],[data-id],[data-back],[data-brand]');
    if (!t || !S) return;
    tap();
    if (t.dataset.back) return back();
    if (t.dataset.tab) view.tab = t.dataset.tab;
    if (t.dataset.chip) view.chip = t.dataset.chip;
    if (t.dataset.brand != null) view.brand = +t.dataset.brand;
    if (t.dataset.id) { view.cluster = t.dataset.id; window.scrollTo(0, 0); }
    render();
  });
  function once(host, ms) {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, ms);
    return fetch(host + '/api/olya/state', {headers: {'X-Tg-Init-Data': tg ? tg.initData : ''}, signal: ctl.signal})
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401 || r.status === 403) return Promise.reject('auth');
        if (r.status === 503) return Promise.reject('nostate');
        if (!r.ok) return Promise.reject('http');
        return r.json();
      }, function (e) { clearTimeout(timer); return Promise.reject(e && e.name === 'AbortError' ? 'timeout' : 'net'); });
  }
  function load(attempt) {
    once(API_HOSTS[attempt % API_HOSTS.length], attempt === 0 ? 15000 : 12000).then(function (data) { S = data; render(); }, function (e) {
      if ((e === 'timeout' || e === 'net' || e === 'http') && attempt + 1 < API_HOSTS.length) {
        list.innerHTML = '<div class="empty">Связь застряла, пробую ещё раз (' + (attempt + 2) + ' из ' + API_HOSTS.length + ')…</div>';
        return load(attempt + 1);
      }
      list.innerHTML = '<div class="empty">' + esc(e === 'auth' ? 'Нет доступа. Откройте из лички @olya_reklama_bot — кнопка «Реклама».'
        : e === 'nostate' ? 'Данные ещё собираются — загляните через 10 минут.' : 'Не достучалась до сервера. Проверьте связь и откройте ещё раз.') + '</div>';
    });
  }
  if (!inTg) { list.innerHTML = '<div class="empty">Откройте из Telegram: личка @olya_reklama_bot → кнопка «Реклама».</div>'; return; }
  load(0);
})();
</script>
</body>
</html>
